# ── Coraza engine configuration ─────────────────────────────────────────
# Start in DetectionOnly, watch the logs for a few days of real traffic,
# tune false positives (exclusions below), THEN flip to On.
SecRuleEngine DetectionOnly

# ── Request body inspection ─────────────────────────────────────────────
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyInMemoryLimit 131072
# Reject (not silently truncate) bodies over the limit — truncation is a
# classic bypass: attacker pads the front, payload rides past inspection.
SecRequestBodyLimitAction Reject

# ── Response body inspection (phase 4: data leakage, stack traces) ──────
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html application/json
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial

# ── Misc engine settings ─────────────────────────────────────────────────
SecArgumentsLimit 1000
SecAuditEngine RelevantOnly
# Log 5xx, and 4xx except 404. Coraza uses Go's RE2 engine, which does NOT
# support lookaheads — so the usual "^(?:5|4(?!04))" is rewritten without one:
# 400-403, 405-499, and any 5xx.
SecAuditLogRelevantStatus "^(?:5[0-9]{2}|40[0-35-9]|4[1-9][0-9])$"
SecAuditLogParts ABIJDEFHZ
SecAuditLog /var/log/waf/audit.log
SecAuditLogFormat JSON

# ── Baseline sanity rules (yours, before CRS) ────────────────────────────
# Block requests with no Host header (HTTP/1.0 scanners, smuggling probes)
SecRule &REQUEST_HEADERS:Host "@eq 0" \
    "id:1001,phase:1,deny,status:400,log,msg:'Missing Host header'"

# Refuse ambiguous Transfer-Encoding + Content-Length combos outright —
# this is the request-smuggling primitive; don't try to be clever about it.
SecRule &REQUEST_HEADERS:Transfer-Encoding "@gt 0" \
    "id:1002,phase:1,chain,deny,status:400,log,msg:'TE+CL smuggling attempt'"
    SecRule &REQUEST_HEADERS:Content-Length "@gt 0"

# ── OWASP Core Rule Set ──────────────────────────────────────────────────
# git clone https://github.com/coreruleset/coreruleset /etc/waf/crs
# cp /etc/waf/crs/crs-setup.conf.example /etc/waf/crs/crs-setup.conf
# In crs-setup.conf set anomaly thresholds (start: inbound 5, outbound 4).
Include /etc/waf/crs/crs-setup.conf
Include /etc/waf/crs/rules/*.conf

# ── Your exclusions AFTER the CRS includes ───────────────────────────────
# Example: app legitimately posts HTML into one field; drop the XSS rules
# for that single argument instead of loosening globally.
# SecRule REQUEST_URI "@beginsWith /api/articles" \
#     "id:9001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:body_html"
