name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build, vet, test (portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      # Portable Coraza-only path: GitHub runners have no libhs, which matches
      # build.sh's fallback when pkg-config/libhs is absent. The native
      # vectorscan+cgo path is qualified on a prepared host, not here.
      # go build fails loudly if go.mod is out of sync with the source, which is
      # the regression that once shipped build-broken to main.
      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go vet
        run: CGO_ENABLED=0 go vet ./...

      # Runs the whole suite, including TestReleaseScriptsAreLFAndBashSyntaxClean,
      # which asserts every release script is LF-only and executable.
      - name: go test
        run: CGO_ENABLED=0 go test ./...

      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./...

      - name: real Coraza transaction truth gate
        run: CGO_ENABLED=1 go test -tags realcoraza -run 'TestRealCoraza' ./...

  govulncheck:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
